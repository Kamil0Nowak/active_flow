# fly.toml app configuration file generated for active-flow on 2026-07-26T16:19:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'active-flow'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
